<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML5</title>
</head>
<body>
    <h1>imagem dinamica</h1>
    <p>tente abrir esse site em varios dispositivos diferentes, ou simplismente aumente e diminua o zoom do seu navegador </p>
    <picture>
        <source media="(max-width:750px )" srcset="imagens/pequeno.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/media.png" type="image/png">
        <img src="imagens/grande.png" alt="foto frexivel">
    </picture>       
   >
   <h1>replodusindo audio</h1>
   <p>vamos aprender a replodusir audio</p>
   <p>audio1</p>
   <audio src="midia/audio1.mp3" controls autoplay></audio>
  <!-- MP3 WAV OGG -->
   <p>audio2</p>
   <audio preload= "metadata" autoplay controls>
      <source src="midia/audio2.mp3" type="audio/mpeg">
      <p>infelizmente seu navegado não comsegue reproduzir o audio <a href="midia/audio2.mp3">clique aqui para abaxar o audio MP3</a></p>

   </audio>
</body>
</html>
