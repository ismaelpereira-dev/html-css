<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>
        /* seleores personalizados
           #  = id
           .  =  class
           :  = pseudo class
           :: = pseudo element
           >  = cliindren

        
        */
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        a{
            color: rgb(255, 0, 0);
            text-decoration: none;
            font-weight: bold;
        }
        a:visited{
           color: darkred; 
        }
        a:hover{
            text-decoration: underline;
            color: black;
        }
        a:active{
            color: yellow;
        }
        a::after{
            content: '[ link]';
            color: darkgray;
            text-decoration: none;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>personalizandos links</h1>
    <ul>
        <li><a href="https://gustavoguanabara.github.io">repositorio GITHUB</a></li>
        <li><a href="https://youtube.com/cursoemvideo/">canal do YOUTUBE</a></li>
        <li><a href="https://www.cursoemvideo.com">site do CURSO EM VIDEO</a></li>

    </ul>
</body>
</html>
